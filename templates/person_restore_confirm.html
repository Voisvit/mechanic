{% extends "layout.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm border-success">
            <div class="card-body p-4">
                <p class="text-secondary mb-1">Відповідальні особи</p>
                <h1 class="h3 mb-3">Відновити особу</h1>
                <p class="mb-4">
                    Особа <strong>{{ person.full_name }}</strong> знову з’явиться у списку дійових осіб і в доступних dropdown-списках.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Скасувати</a>
                        <button type="submit" class="btn btn-success">Підтвердити відновлення</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
