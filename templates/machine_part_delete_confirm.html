{% extends "layout.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body p-4">
                <p class="text-secondary mb-1">{{ machine.name }}</p>
                <h1 class="h3 mb-3">Видалити запчастину з машини</h1>
                <p class="mb-4">
                    Буде видалено прив’язку <strong>{{ machine_part.part.name }}</strong> до машини <strong>{{ machine.name }}</strong>.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Скасувати</a>
                        <button type="submit" class="btn btn-danger">Зберегти</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
