<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ page_title }}{% endblock %} | {{ system_name }}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
        crossorigin="anonymous"
    >
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Журнал ТО</a>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Головна</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'equipment' %}">Обладнання</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'archive_index' %}">Архів</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'parts' %}">Запчастини</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'references' %}">Відповідальні особи</a></li>
                </ul>
                {% if request.user.is_authenticated %}
                <div class="d-flex align-items-center gap-3 ms-lg-4 mt-3 mt-lg-0">
                    <span class="navbar-text text-white-50">Вітаю Валентин!</span>
                    <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Вийти</a>
                </div>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="py-5">
        <div class="container">
            {% if messages %}
            <div class="mb-4">
                {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} mb-2" role="alert">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% block content %}{% endblock %}
        </div>
    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"
    ></script>
</body>
</html>
